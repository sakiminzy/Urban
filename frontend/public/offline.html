<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Urban Harvest Hub - Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #edf8f1;
        color: #123b25;
        font-family: Inter, system-ui, sans-serif;
      }

      main {
        width: min(90vw, 560px);
        padding: 32px;
        border-radius: 24px;
        background: white;
        box-shadow: 0 24px 80px rgba(18, 59, 37, 0.14);
      }

      h1 {
        margin: 0 0 12px;
        font-size: 2rem;
      }

      p {
        margin: 0;
        line-height: 1.7;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You are offline</h1>
      <p>
        You are offline. Some content may be unavailable, but cached pages can
        still be viewed.
      </p>
    </main>
  </body>
</html>
